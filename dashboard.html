<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>CB Reminder</title>
<style>
  * { box-sizing: border-box; }
  body { width: 400px; max-height: 580px; overflow-y: auto; margin: 0; padding: 14px;
    font: 13px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; color: #111827; background: #fff; }
  h1 { font-size: 14px; margin: 0 0 2px; display: flex; align-items: center; gap: 7px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #16a34a; }
  .dot.warn { background: #d97706; } .dot.err { background: #dc2626; } .dot.run { background: #2563eb; }
  .sub { color: #6b7280; font-size: 11.5px; margin-bottom: 10px; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  button { font-family: inherit; font-size: 12px; border-radius: 7px; cursor: pointer; }
  .primary { background: #111827; color: #fff; border: 0; padding: 7px 12px; }
  .primary:hover { background: #374151; }
  .primary:disabled { background: #9ca3af; cursor: default; }
  .ghost { background: #fff; border: 1px solid #e5e7eb; padding: 7px 10px; color: #374151; }
  .ghost:hover { border-color: #9ca3af; }
  .bar { height: 5px; background: #f3f4f6; border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
  .bar > i { display: block; height: 100%; background: #2563eb; width: 0; transition: width .3s; }
  .warn-box { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; border-radius: 8px;
    padding: 8px 10px; font-size: 12px; margin-bottom: 10px; }
  .stats { display: flex; gap: 6px; margin-bottom: 12px; }
  .stat { flex: 1; background: #f9fafb; border: 1px solid #f3f4f6; border-radius: 8px; padding: 7px; text-align: center; }
  .stat b { display: block; font-size: 15px; }
  .stat span { font-size: 10.5px; color: #6b7280; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #6b7280;
    margin: 14px 0 6px; border-top: 1px solid #f3f4f6; padding-top: 10px; }
  input { width: 100%; padding: 7px 9px; border: 1px solid #e5e7eb; border-radius: 7px;
    font: inherit; font-size: 12px; }
  #rev-cfg input { margin-bottom: 6px; }
  .pct.rev { color: #5b21b6; background: #ede9fe; }
  .list { max-height: 190px; overflow-y: auto; }
  .item { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid #f9fafb; font-size: 12px; }
  .item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .m { color: #6b7280; font-size: 10.5px; }
  .pct { font-weight: 700; font-size: 11px; color: #065f46; background: #ecfdf5;
    border-radius: 5px; padding: 2px 5px; white-space: nowrap; }
  .mini { background: none; border: 0; color: #6b7280; text-decoration: underline; font-size: 11px; padding: 0; }
  .mini:hover { color: #111827; }
  .empty { color: #9ca3af; font-size: 11.5px; padding: 6px 0; }
  @media (prefers-color-scheme: dark) {
    body { background: #111827; color: #f3f4f6; }
    .ghost { background: #111827; border-color: #374151; color: #e5e7eb; }
    .primary { background: #f3f4f6; color: #111827; }
    .primary:hover { background: #fff; color: #111827; }
    .primary:disabled { background: #4b5563; color: #d1d5db; }
    .stat { background: #1f2937; border-color: #374151; }
    .bar { background: #1f2937; }
    input { background: #1f2937; border-color: #374151; color: #f3f4f6; }
    h2, .item { border-color: #1f2937; }
    .pct { color: #6ee7b7; background: #064e3b; }
    .pct.rev { color: #ddd6fe; background: #3b0764; }
    .warn-box { background: #3f2d0b; border-color: #78350f; color: #fcd34d; }
    .mini { color: #9ca3af; }
    .mini:hover { color: #fff; }
  }
</style>
</head>
<body>
  <h1><span class="dot" id="dot"></span><span id="title">CB Reminder</span></h1>
  <div class="sub" id="sub">…</div>

  <div id="warn"></div>
  <div class="bar" id="bar" hidden><i></i></div>

  <div class="row">
    <button class="primary" id="sync">Aggiorna ora</button>
    <button class="ghost" id="portal">Apri il portale</button>
  </div>

  <div class="stats">
    <div class="stat"><b id="s-count">–</b><span>offerte</span></div>
    <div class="stat"><b id="s-dom">–</b><span>con dominio</span></div>
    <div class="stat"><b id="s-gc">–</b><span>gift card</span></div>
  </div>

  <h2>Revolut</h2>
  <div class="sub" id="rev-sub">Non configurato.</div>
  <div class="row">
    <button class="ghost" id="rev-sync">Aggiorna Revolut</button>
  </div>
  <div class="list" id="rev-list"></div>

  <h2>Cerca nel catalogo</h2>
  <input id="q" placeholder="Apple, Zalando, Expedia…" autocomplete="off">
  <div class="list" id="results"></div>

  <h2>Segnalazioni di errore</h2>
  <div class="list" id="blocked"></div>

  <h2>Siti silenziati</h2>
  <div class="list" id="muted"></div>

  <script src="dashboard.js"></script>
</body>
</html>
