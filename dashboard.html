<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Discount Check</title>
<style>
  /* --- token ------------------------------------------------------------- */
  /* Tre gradi tipografici (11 / 12.5 / 14.5) e cinque colori con un significato solo:
     verde = Corporate Benefits, viola = Revolut, blu = sync, ambra = login, rosso = errore. */
  :root {
    color-scheme: light dark;
    --bg: #fbfbfc;
    --surface: #ffffff;
    --raise: #f1f3f5;
    --line: #e4e7ea;
    --line-soft: #eef0f2;
    --ink: #14161a;
    --ink-2: #59626e;
    --ink-3: #69727d;
    --cb-ink: #067a52;
    --cb-bg: #e6f5ee;
    --rev-ink: #6b28d9;
    --rev-bg: #f0eafd;
    --run: #1d4ed8;
    --warn-ink: #8a5106;
    --warn-bg: #fdf3e2;
    --warn-line: #f2d9a8;
    --err-ink: #a4231a;
    --err-bg: #fdeceb;
    --err-line: #f3c3bf;
    --focus: #2563eb;
    --sel: #dbe6ff;
    --r: 8px;
    --t: 160ms cubic-bezier(.2, .7, .3, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1114;
      --surface: #16191e;
      --raise: #232830;
      --line: #272c34;
      --line-soft: #1e232a;
      --ink: #eceef1;
      --ink-2: #9aa4b0;
      --ink-3: #7d8794;
      --cb-ink: #34d399;
      --cb-bg: #06301f;
      --rev-ink: #c4b5fd;
      --rev-bg: #2e1065;
      --run: #60a5fa;
      --warn-ink: #fbbf24;
      --warn-bg: #2f2409;
      --warn-line: #5a4310;
      --err-ink: #fca5a5;
      --err-bg: #3a1210;
      --err-line: #6d2420;
      --focus: #60a5fa;
      --sel: #1e3a8a;
    }
  }

  * { box-sizing: border-box; }
  ::selection { background: var(--sel); }

  html { scrollbar-color: var(--line) transparent; }
  body {
    width: 400px; max-height: 580px; margin: 0;
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font: 12.5px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-variant-numeric: tabular-nums;
    caret-color: var(--focus);
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  .ic { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none;
    stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

  /* --- header ------------------------------------------------------------ */
  .hd { flex: none; padding: 12px 14px 10px; background: var(--surface);
    border-bottom: 1px solid var(--line); }
  .hd-top { display: flex; align-items: baseline; gap: 8px; }
  h1 { font-size: 14.5px; font-weight: 650; letter-spacing: -.015em; margin: 0; }
  .hd-meta { margin-left: auto; font-size: 11px; color: var(--ink-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--cb-ink);
    flex: none; align-self: center; position: relative; }
  .dot.warn { background: var(--warn-ink); }
  .dot.err { background: var(--err-ink); }
  .dot.run { background: var(--run); }
  .dot.run::after { content: ""; position: absolute; inset: -3px; border-radius: 50%;
    border: 1.5px solid var(--run); animation: ping 1.6s cubic-bezier(.2,.7,.3,1) infinite; }
  @keyframes ping { 0% { transform: scale(.6); opacity: .9 } 100% { transform: scale(1.9); opacity: 0 } }

  .bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden;
    margin-top: 9px; }
  .bar > i { display: block; height: 100%; width: 100%; background: var(--run);
    transform: scaleX(0); transform-origin: left;
    transition: transform 300ms cubic-bezier(.2,.7,.3,1); }

  .hd-actions { display: flex; gap: 6px; margin-top: 10px; }
  .btn { font: inherit; font-size: 12.5px; font-weight: 550; line-height: 1;
    padding: 8px 11px; border-radius: var(--r); cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    display: inline-flex; align-items: center; gap: 6px;
    transition: background var(--t), border-color var(--t), color var(--t); }
  .btn:hover { background: var(--raise); border-color: var(--ink-3); }
  .btn:active { transform: translateY(.5px); }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }
  .btn.primary:hover { background: var(--ink-2); border-color: var(--ink-2); }
  .btn:disabled { cursor: default; color: var(--ink-3); background: var(--raise);
    border-color: var(--line); transform: none; }
  /* Il giro dell'icona dice "sto lavorando", non "sono disabilitato": sta su .busy. */
  .btn.busy .ic { animation: spin 1.1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }

  /* --- ricerca ----------------------------------------------------------- */
  .search { position: relative; display: flex; align-items: center; margin-top: 8px; }
  .search > .ic { position: absolute; left: 9px; color: var(--ink-3); pointer-events: none; }
  input {
    width: 100%; font: inherit; font-size: 12.5px; color: var(--ink);
    padding: 8px 30px 8px 31px; border: 1px solid var(--line); border-radius: var(--r);
    background: var(--bg); transition: border-color var(--t), background var(--t);
  }
  input::placeholder { color: var(--ink-2); }
  input:hover { border-color: var(--ink-3); }
  input:focus { outline: none; border-color: var(--focus); background: var(--surface);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 18%, transparent); }
  .clear[hidden] { display: none; }
  .clear { position: absolute; right: 5px; display: flex; padding: 4px; border: 0;
    border-radius: 6px; background: none; color: var(--ink-3); cursor: pointer; }
  .clear:hover { background: var(--raise); color: var(--ink); }

  /* --- corpo scorrevole --------------------------------------------------- */
  main { overflow-y: auto; overscroll-behavior: contain; padding: 0 14px 14px; }
  main::-webkit-scrollbar { width: 9px; }
  main::-webkit-scrollbar-thumb { background: var(--line); border-radius: 9px;
    border: 3px solid var(--bg); }
  main::-webkit-scrollbar-thumb:hover { background: var(--ink-3); }

  .warn-box { display: flex; gap: 8px; background: var(--warn-bg); color: var(--warn-ink);
    border: 1px solid var(--warn-line); border-radius: var(--r);
    padding: 9px 10px; font-size: 12.5px; margin-top: 12px; }
  .warn-box.err { background: var(--err-bg); color: var(--err-ink); border-color: var(--err-line); }
  .warn-box .ic { margin-top: 1px; }
  .warn-box b { font-weight: 600; }
  .warn-box .btn { display: flex; width: fit-content; margin-top: 9px; }

  /* --- statistiche -------------------------------------------------------- */
  .stats { display: flex; align-items: center; gap: 9px; padding: 15px 2px 5px;
    font-size: 11px; color: var(--ink-2); }
  .stats b { font-weight: 600; font-size: 12.5px; color: var(--cb-ink); }
  .stats i { font-style: normal; color: var(--ink-3); }
  .stats .s-rev b { color: var(--rev-ink); }

  /* --- gruppi ------------------------------------------------------------- */
  .grp { display: flex; align-items: center; gap: 7px; position: sticky; top: 0; z-index: 2;
    padding: 12px 0 6px; background: var(--bg);
    font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink-2); border-bottom: 1px solid var(--line-soft); }
  .grp::before { content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--cb-ink); flex: none; }
  .grp.rev::before { background: var(--rev-ink); }
  .grp .n { margin-left: auto; letter-spacing: 0; color: var(--ink-3); font-weight: 550; }

  details { border-bottom: 1px solid var(--line-soft); }
  details > summary { display: flex; align-items: center; gap: 7px; cursor: pointer;
    padding: 15px 0 10px; list-style: none;
    font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink-2); transition: color var(--t); }
  details > summary:hover { color: var(--ink); }
  details > summary::-webkit-details-marker { display: none; }
  summary .ic { width: 13px; height: 13px; color: var(--ink-3);
    transition: transform var(--t); }
  details[open] summary .ic { transform: rotate(90deg); }
  summary .n { margin-left: auto; letter-spacing: 0; color: var(--ink-3); font-weight: 550; }
  details > .body { padding-bottom: 8px; animation: reveal 180ms cubic-bezier(.2,.7,.3,1); }
  @keyframes reveal { from { opacity: 0; transform: translateY(-3px) } }

  /* --- riga --------------------------------------------------------------- */
  .item { display: flex; gap: 9px; align-items: center; padding: 8px 6px; margin: 0 -6px;
    border-radius: var(--r); transition: background var(--t); }
  .item:hover { background: var(--raise); }
  .item + .item { box-shadow: 0 -1px 0 var(--line-soft); }
  .item .t { flex: 1; min-width: 0; }
  .item .t > b { display: block; font-weight: 550; font-size: 12.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .m { color: var(--ink-2); font-size: 11px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  mark { background: color-mix(in srgb, var(--focus) 22%, transparent); color: inherit;
    border-radius: 2px; }

  /* Lo sconto scritto dal portale non è sempre una percentuale: il chip tiene solo
     quello che lo è, il resto scende nella riga di dettaglio. */
  .pct { font-weight: 650; font-size: 11px; letter-spacing: -.01em; white-space: nowrap;
    flex: none; min-width: 46px; max-width: 76px; overflow: hidden; text-overflow: ellipsis;
    text-align: center;
    color: var(--cb-ink); background: var(--cb-bg); border-radius: 6px; padding: 4px 6px; }
  .pct.rev { color: var(--rev-ink); background: var(--rev-bg); }
  .pct.none { color: var(--ink-3); background: var(--raise); }

  /* Il bottone si stacca dalla riga andando verso l'inchiostro, così vale nei due temi. */
  .act { display: flex; padding: 5px; border: 0; border-radius: 6px; background: none;
    color: var(--ink-3); cursor: pointer; flex: none;
    transition: background var(--t), color var(--t), box-shadow var(--t); }
  .act:hover { color: var(--ink); background: color-mix(in srgb, var(--ink) 10%, var(--raise));
    box-shadow: inset 0 0 0 1px var(--ink-3); }

  /* --- alias inline -------------------------------------------------------- */
  .alias { display: flex; gap: 6px; padding: 6px 0 10px; }
  .alias input { font-size: 12.5px; padding: 7px 9px; }
  .alias .btn { padding: 7px 10px; }

  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .empty { color: var(--ink-2); font-size: 11px; padding: 10px 0 12px; max-width: 46ch; }
  .empty b { display: block; color: var(--ink); font-weight: 600; font-size: 12.5px;
    margin-bottom: 2px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<!--
  THESIS: uno strumento da consultazione, non un cruscotto: lo stato del catalogo e la
  ricerca stanno sempre a schermo, tutto il resto scorre sotto. Rifiuta la griglia di
  card-statistica che ogni popup di estensione mette in cima.
  OWN-WORLD: fondo neutro, filetti da 1px al posto dei box, riga come unità base, tre gradi
  tipografici di sistema (11/12.5/14.5) con cifre tabulari. Il colore è solo semantica:
  verde = Corporate Benefits, viola = Revolut, blu = sync in corso, ambra = login scaduto,
  rosso = sync fallita.
  STORY: apro, vedo se il catalogo è fresco, scrivo un negozio, leggo cosa ho su quel
  negozio da entrambe le fonti.
  FIRST VIEWPORT: header fisso — stato + progresso + due azioni + campo di ricerca già a
  fuoco; sotto, riepilogo del catalogo e le tre sezioni di manutenzione richiudibili.
  FORM: scorrimento unico sezionato con testata fissa (candidata 3 di 7, seed 3b0df6c6).
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review,
  the verdict, and DESIGN.md
-->

<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20.5 20.5 16 16"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.49-6.01"/><path d="M20.5 4.5V10h-5.5"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14.5V19a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 19V8a1.5 1.5 0 0 1 1.5-1.5H10"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13.5a4 4 0 0 0 5.66 0l3-3A4 4 0 0 0 13 4.84l-1.5 1.5"/><path d="M14 10.5a4 4 0 0 0-5.66 0l-3 3A4 4 0 0 0 11 19.16l1.5-1.5"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M4 7v5h5"/><path d="M4.6 12a7.6 7.6 0 1 1 2 5.5"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6.5 9a5.5 5.5 0 0 1 11 0c0 5.5 2 7 2 7h-15s2-1.5 2-7"/><path d="M10.2 19.5a2 2 0 0 0 3.6 0"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6 18 18"/><path d="M18 6 6 18"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4.5 21 19.5H3z"/><path d="M12 10v4"/><path d="M12 17h.01"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
</svg>

<header class="hd">
  <div class="hd-top">
    <span class="dot" id="dot"></span>
    <h1 id="title">Discount Check</h1>
    <span class="hd-meta" id="sub">leggo lo stato…</span>
  </div>
  <div class="bar" id="bar" hidden><i></i></div>
  <div class="hd-actions">
    <button class="btn primary" id="sync"><svg class="ic"><use href="#i-refresh"/></svg><span id="sync-label">Aggiorna tutto</span></button>
    <button class="btn" id="portal"><svg class="ic"><use href="#i-external"/></svg>Apri il portale</button>
  </div>
  <div class="search">
    <svg class="ic"><use href="#i-search"/></svg>
    <input id="q" placeholder="Cerca un negozio…" autocomplete="off" autofocus
      aria-label="Cerca un negozio nei cataloghi Corporate Benefits e Revolut">
    <button class="clear" id="q-clear" hidden aria-label="Svuota la ricerca" title="Svuota">
      <svg class="ic"><use href="#i-x"/></svg>
    </button>
  </div>
</header>

<main>
  <div id="warn"></div>

  <!-- Annuncia solo il conteggio: leggere l'intera lista a ogni tasto è peggio del silenzio. -->
  <p id="results-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
  <section id="results" hidden></section>

  <div id="browse">
    <div class="stats">
      <span><b id="s-count">–</b> offerte Corporate Benefits</span>
      <i>·</i>
      <span class="s-rev"><b id="s-rev">–</b> negozi Revolut</span>
    </div>

    <details id="d-cb">
      <summary><svg class="ic"><use href="#i-chevron"/></svg>Catalogo Corporate Benefits<span class="n" id="n-cb"></span></summary>
      <div class="body" id="cb-list"></div>
    </details>

    <details id="d-rev">
      <summary><svg class="ic"><use href="#i-chevron"/></svg>Catalogo Revolut<span class="n" id="n-rev"></span></summary>
      <div class="body">
        <div class="hd-actions" style="margin:0 0 8px">
          <button class="btn" id="rev-sync"><svg class="ic"><use href="#i-refresh"/></svg>Aggiorna Revolut</button>
          <span class="hd-meta" id="rev-sub" style="align-self:center"></span>
        </div>
        <div id="rev-list"></div>
      </div>
    </details>

    <details id="d-blocked">
      <summary><svg class="ic"><use href="#i-chevron"/></svg>Segnalazioni di errore<span class="n" id="n-blocked"></span></summary>
      <div class="body" id="blocked"></div>
    </details>

    <details id="d-muted">
      <summary><svg class="ic"><use href="#i-chevron"/></svg>Siti silenziati<span class="n" id="n-muted"></span></summary>
      <div class="body" id="muted"></div>
    </details>
  </div>
</main>

<script src="dashboard.js"></script>
</body>
</html>
