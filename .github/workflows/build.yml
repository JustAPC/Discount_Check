name: build

# Il workflow verifica, impacchetta e archivia l'estensione. Quando la versione del
# manifest non ha ancora una GitHub Release, pubblica anche quella con lo ZIP allegato.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Il parsing del portale è a regex e si rompe in silenzio: se i test non passano
      # il pacchetto non si costruisce, invece di caricarne uno che trova zero offerte.
      - run: node test.js

      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version manifest.json)"
          tag="v${version}"
          echo "v=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
          fi

      # Nello zip va solo ciò che Chrome carica: niente server, skill, test, docs.
      # Lo Store rifiuta i pacchetti con file di troppo, e comunque non c'è motivo di
      # spedire il codice del server dentro l'estensione.
      - run: |
          mkdir -p dist
          zip -r dist/discount-check.zip . \
            -x '.git/*' '.github/*' '.claude/*' 'dist/*' 'server/*' 'hermes-skill/*' \
               '.impeccable/*' '*.md' 'test.js' '.gitignore' '.prettierrc*' 'store/*' '*.DS_Store'

      # Artifact da caricare anche sul Developer Dashboard dello Store.
      - uses: actions/upload-artifact@v4
        with:
          name: discount-check-${{ steps.v.outputs.v }}
          path: dist/discount-check.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: steps.v.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "Discount Check ${{ steps.v.outputs.tag }}" \
            --generate-notes \
            dist/discount-check.zip
