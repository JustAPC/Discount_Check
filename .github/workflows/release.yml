name: release

# Ogni push su main rigenera lo zip. Il tag è la version del manifest: se non la
# bumpi, la release esistente viene solo riscritta con il codice nuovo e nessuno
# riceve l'avviso di aggiornamento. Bumpare manifest.json è il gesto che dice
# "questa vale la pena scaricarla".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: v
        run: echo "v=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      # Nello zip va solo ciò che Chrome carica: niente server, skill, test, docs.
      - run: |
          mkdir -p dist
          zip -r dist/discount-check.zip . \
            -x '.git/*' '.github/*' 'dist/*' 'server/*' 'hermes-skill/*' \
               '.impeccable/*' '*.md' 'test.js' '.gitignore' '.prettierrc*'

      # Chi clicca l'avviso di aggiornamento atterra qui: le note sono la guida,
      # non un changelog. Chi ha già l'estensione non deve scaricare nulla.
      - run: |
          cat > notes.md <<'EOF'
          ## Hai già Discount Check installato?

          Non scaricare niente da qui: l'aggiornamento è un doppio clic dentro la cartella che usi
          già.

          **1. Non ricordi dov'è quella cartella?**

          Apri la pagina delle estensioni — `chrome://extensions` su Chrome, `brave://extensions` su
          Brave, `edge://extensions` su Edge — premi **Dettagli** sulla scheda di Discount Check e
          leggi il percorso sotto **Origine**. Comodo: dalla dashboard dell'estensione, l'avviso di
          aggiornamento ha un link che ti apre quella pagina da solo.

          **2. Apri la cartella e fai doppio clic su:**

          - **macOS** → `aggiorna.command`
          - **Windows** → `aggiorna.bat`

          **3. Rispondi sì al riavvio del browser.** Lo script riconosce da solo quale stai usando —
          Chrome, Brave, Edge, Vivaldi — e riavvia quello.

          Lo script scarica la versione nuova, fa un backup della cartella e installa sopra.
          L'estensione **non viene rimossa**: credenziali, catalogo, alias e l'icona fissata nella
          barra restano dove sono.

          > Non trovi lo script? Vuol dire che hai una versione precedente alla 1.0.6: fai questo
          > aggiornamento a mano come sotto, una volta sola, e dalla prossima ci pensa lo script.

          ## Prima installazione

          Non scaricare lo zip dal browser: i file arriverebbero marcati come "provenienti da
          internet" e al primo doppio clic sullo script macOS direbbe che _potrebbe contenere
          malware_ (e Windows mostrerebbe SmartScreen). Con una riga di comando il problema non si
          pone.

          **macOS** — apri Terminale e incolla:

          ```bash
          mkdir -p ~/Documents/discount-check && curl -sL -o /tmp/dc.zip https://github.com/JustAPC/Discount_Check/releases/latest/download/discount-check.zip && unzip -oq /tmp/dc.zip -d ~/Documents/discount-check && open ~/Documents/discount-check
          ```

          **Windows** — apri PowerShell e incolla:

          ```powershell
          $d="$env:USERPROFILE\Documents\discount-check"; mkdir $d -Force | Out-Null; Invoke-WebRequest https://github.com/JustAPC/Discount_Check/releases/latest/download/discount-check.zip -OutFile "$env:TEMP\dc.zip"; Expand-Archive "$env:TEMP\dc.zip" $d -Force; explorer $d
          ```

          Poi: pagina delle estensioni (`chrome://extensions`, `brave://extensions`,
          `edge://extensions`) → **Modalità sviluppatore** → **Carica estensione non
          pacchettizzata** → scegli `Documenti/discount-check`. Infine apri la dashboard →
          **Accesso al portale** → email e password → **Salva** → **Aggiorna tutto**.

          > ⚠️ Non usare **Rimuovi** e poi ricaricare: Chrome cancella lo storage dell'estensione e
          > perdi credenziali, catalogo e segnalazioni. Non spostare la cartella: l'ID dipende dal
          > percorso.

          Se scarichi lo zip a mano da qui, funziona lo stesso — ma la prima volta lo script va
          aperto con tasto destro → **Apri** su macOS, o **Ulteriori informazioni** → **Esegui
          comunque** su Windows.

          [Guida completa](https://justapc.github.io/Discount_Check/)
          EOF

      # Avviso una tantum: la 1.0.9 introduce il campo "key" nel manifest e quindi
      # cambia l'ID dell'estensione, che è ciò a cui il browser lega lo storage.
      - if: steps.v.outputs.v == '1.0.9'
        run: |
          cat >> notes.md <<'EOF'

          ---

          ## ⚠️ Solo per questo aggiornamento

          Da questa versione l'ID dell'estensione è fissato nel manifest e non dipende più dalla
          cartella: da domani potrai spostarla senza perdere niente. Il passaggio però costa una
          volta sola: il browser lega lo storage all'ID, che cambia adesso.

          Dopo l'aggiornamento dovrai **reinserire le credenziali del portale** e premere **Aggiorna
          tutto** per riscaricare il catalogo. Anche l'icona va rifissata nella barra, e se resta una
          scheda vecchia di Discount Check nella pagina delle estensioni, rimuovila pure.
          EOF

      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.v.outputs.v }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/discount-check.zip --clobber
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" dist/discount-check.zip --title "$tag" --notes-file notes.md
          fi
